name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung simulation must not hold the runner for hours.
    timeout-minutes: 15
    # The unit tests run in three jobs at once (ID-105): a test file runs on one worker, so
    # the slowest balance files set the time; each of the two slowest gets a job of its own.
    # The last job runs every other file, so a new test file always runs somewhere; a file
    # named here that no longer exists fails its job ("No test files found").
    strategy:
      # Every job runs to the end, so one failure never hides another.
      fail-fast: false
      matrix:
        include:
          - name: Unit (late hordes, guns)
            tests: src/core/balance/late-hordes.test.ts src/core/balance/guns.test.ts
          - name: Unit (horde-only, Squad Power)
            tests: src/core/balance/horde-only.test.ts src/core/balance/squad-power.test.ts
          - name: Lint, build, other unit
            checks: true
            tests: >-
              --exclude src/core/balance/late-hordes.test.ts
              --exclude src/core/balance/guns.test.ts
              --exclude src/core/balance/horde-only.test.ts
              --exclude src/core/balance/squad-power.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it, for these dependencies and this Node version: a hit
      # skips npm ci. The key leaves out the project's own version, which every PR raises;
      # any dependency change in package.json or package-lock.json misses, so npm ci runs
      # and still refuses a lockfile that doesn't match package.json.
      - name: Dependency fingerprint
        id: deps
        run: |
          hash=$(node tools/deps-hash.mjs)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.deps.outputs.hash }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Version raised over main's
        # Each PR to main raises the game's version. Dependabot's PRs never bump it
        # and are let through.
        if: >-
          matrix.checks &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 --no-tags origin "$BASE_REF"
          node tools/version-check.mjs bump FETCH_HEAD
      - if: matrix.checks
        run: npm run lint
      - name: Unit tests
        env:
          TESTS: ${{ matrix.tests }}
        # $TESTS unquoted: one argument per file or flag.
        run: npx vitest run $TESTS
      - if: matrix.checks
        run: npm run build

  check:
    # The required status check on main: green only when every job above is.
    # Add new jobs to `needs`.
    name: Lint, test, build
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: needs.build.result != 'success'
        run: exit 1
