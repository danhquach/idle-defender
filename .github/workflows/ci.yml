name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ID-268: whether this run needs the balance jobs. A pull request runs them only when it
  # touches the simulation (a non-test file in src/core), a balance test, this workflow or
  # the Vite/Vitest config; a UI-only change skips them. A push to main always runs them, which
  # keeps the balance cache warm for every branch.
  changes:
    name: Balance needed?
    runs-on: ubuntu-latest
    outputs:
      balance: ${{ steps.diff.outputs.balance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "balance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request's checkout is its merge into the base: HEAD^1 is the base, so
          # this lists the pull request's own changes.
          files=$(git diff --name-only HEAD^1 HEAD)
          sim=$(printf '%s\n' "$files" | grep -E '^src/core/.+\.ts$' | grep -Ev '\.test\.ts$' || true)
          other=$(printf '%s\n' "$files" | grep -E '^(src/core/balance/|\.github/workflows/ci\.yml$|vite(st)?\.config\.ts$)' || true)
          if [ -n "$sim$other" ]; then balance=true; else balance=false; fi
          echo "balance=$balance" >> "$GITHUB_OUTPUT"
          printf 'balance=%s\n%s\n%s\n' "$balance" "$sim" "$other"

  build:
    name: ${{ matrix.name }}
    needs: [changes]
    runs-on: ubuntu-latest
    # ID-268: the balance jobs do nothing (each step skipped) when `changes` says no; the
    # "Lint, build, other unit" job (`checks`) always runs.
    env:
      RUN: ${{ matrix.checks || needs.changes.outputs.balance == 'true' }}
    # A normal run takes a few minutes; a hung simulation must not hold the runner for hours.
    # A job may name its own limit (`timeout`); the rest stop at 15 minutes.
    timeout-minutes: ${{ matrix.timeout || 15 }}
    # The unit tests run in ten jobs at once (ID-105, ID-149, ID-152, ID-218, ID-238, ID-247): a test file runs on one
    # worker, so the slowest balance files set the time and get jobs of their own. (ID-146 removed the
    # stats files, ID-125's slowest, and their job.)
    # The last job runs every other file, so a new test file always runs somewhere; a file
    # named here that no longer exists fails its job ("No test files found").
    strategy:
      # Every job runs to the end, so one failure never hides another.
      fail-fast: false
      matrix:
        include:
          # ID-153: the late hordes play 16 campaigns, 4 before (this whole job took 2.5 minutes
          # on main with the cache, about 5 without); each campaign is about 20 s, so about 10
          # minutes uncached now. The job has 25 for headroom.
          - name: Unit (late hordes, guns)
            tests: src/core/balance/late-hordes.test.ts src/core/balance/guns.test.ts
            timeout: 25
          - name: Unit (horde-only, Squad Power)
            tests: src/core/balance/horde-only.test.ts src/core/balance/squad-power.test.ts
          # ID-149: the professions test plays 60 seeds and the Barbed Wire check 6
          # campaigns, too slow to share the last job. ID-152: together they ran past the
          # 15-minute limit (about 14 minutes before), so each has a job of its own. Since
          # ID-147 the professions file alone takes 13 to 15+ minutes (main was cancelled at
          # 15), so its job has 25 (ID-150).
          - name: Unit (professions)
            tests: src/core/balance/professions.test.ts
            timeout: 25
          - name: Unit (wire)
            tests: src/core/balance/wire.test.ts
          # ID-218: the difficulty modes play 20 seeds through Nightmare 1–30 and three
          # overpowered checks (about 4.5 minutes on one local worker, uncached); sharing the
          # last job ran it past 15 minutes, so it has a job of its own with headroom.
          - name: Unit (modes)
            tests: src/core/balance/modes.test.ts
            timeout: 25
          # ID-222: Hell plays 20 seeds through Hell 1–30 with its new boss skills and its own
          # hold-level search; the same reason as the modes job, a job of its own.
          - name: Unit (hell)
            tests: src/core/balance/hell.test.ts
            timeout: 25
          # ID-238: the themed-hordes balance file plays 20 seeds on each of four themes through
          # Normal 25, Nightmare 15, Hell 15 and 20 campaigns (about 8 minutes on one local worker,
          # uncached); sharing the last job ran it past 15 minutes, so it has a job of its own.
          - name: Unit (themes)
            tests: src/core/balance/themes.test.ts
            timeout: 25
          # ID-247: the gun-parity balance file plays 20 seeds on four hordes, a 10-of-20 bisect
          # and five squads each (about 7 minutes on one local worker, uncached); a job of its own.
          - name: Unit (gun parity)
            tests: src/core/balance/gun-parity.test.ts
            timeout: 25
          # ID-247: the enemy-traits balance file (ID-237) bisects hold levels for five squads on
          # two hordes; uncached it took 10.5 minutes in the last job and ran that job past 15
          # minutes, so it has a job of its own.
          - name: Unit (traits)
            tests: src/core/balance/traits.test.ts
            timeout: 25
          # ID-265: the research file plays the stuck guard (five hordes, 20 seeds) and the skip-research
          # metric (12 squads, 20 seeds, played twice), about 580 fights on top of its older 42; the
          # last job also runs the older balance files (bare, cards, farming, horror, ...), which take
          # about 6 minutes together uncached (one local worker, cache off; ID-265), so with the
          # research file out of it that job stays well inside its 15. A job of its own.
          - name: Unit (research)
            tests: src/core/balance/research.test.ts
            timeout: 25
          - name: Lint, build, other unit
            checks: true
            tests: >-
              --exclude src/core/balance/late-hordes.test.ts
              --exclude src/core/balance/guns.test.ts
              --exclude src/core/balance/horde-only.test.ts
              --exclude src/core/balance/squad-power.test.ts
              --exclude src/core/balance/professions.test.ts
              --exclude src/core/balance/wire.test.ts
              --exclude src/core/balance/modes.test.ts
              --exclude src/core/balance/hell.test.ts
              --exclude src/core/balance/themes.test.ts
              --exclude src/core/balance/gun-parity.test.ts
              --exclude src/core/balance/traits.test.ts
              --exclude src/core/balance/research.test.ts
    steps:
      - name: Balance skipped
        if: env.RUN != 'true'
        run: echo '::notice::No simulation change, so the balance tests are skipped (ID-268).'
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 22
          cache: npm
      # node_modules as npm ci left it, for these dependencies and this Node version: a hit
      # skips npm ci. The key leaves out the project's own version, which every PR raises;
      # any dependency change in package.json or package-lock.json misses, so npm ci runs
      # and still refuses a lockfile that doesn't match package.json.
      - name: Dependency fingerprint
        if: env.RUN == 'true'
        id: deps
        run: |
          hash=$(node tools/deps-hash.mjs)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: modules
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ steps.deps.outputs.hash }}
      - if: env.RUN == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The balance tests' results (ID-142, src/core/balance/cache.ts), per job: each entry
      # is keyed inside by the simulation code, Node's version and its test file. A change
      # outside src/core replays no fights; a test file's change replays that file only;
      # any other change in src/core replays them all. Saved only by a job that passes.
      - if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/balance
          key: balance-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-job${{ strategy.job-index }}-${{ hashFiles('src/core/**/*.ts') }}
          restore-keys: balance-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-job${{ strategy.job-index }}-
      - name: Version raised over main's
        # Each PR to main raises the game's version. Dependabot's PRs never bump it
        # and are let through.
        if: >-
          matrix.checks &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 --no-tags origin "$BASE_REF"
          node tools/version-check.mjs bump FETCH_HEAD
      - if: matrix.checks
        run: npm run lint
      - name: Unit tests
        if: env.RUN == 'true'
        env:
          TESTS: ${{ matrix.tests }}
        # $TESTS unquoted: one argument per file or flag.
        run: npx vitest run $TESTS
      - if: matrix.checks
        run: npm run build

  check:
    # The required status check on main: green only when every job above is.
    # Add new jobs to `needs`.
    name: Lint, test, build
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: needs.changes.result != 'success' || needs.build.result != 'success'
        run: exit 1
