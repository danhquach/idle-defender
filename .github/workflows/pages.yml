name: Pages

# Publishes main to GitHub Pages once CI has passed on it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One deploy at a time. A queued run that gets replaced would have skipped anyway,
  # since main has moved past it.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Only a green CI run from a push to main deploys; PR runs never do.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Still main's head
        # CI runs can finish out of order; an older commit must not replace a newer deploy.
        id: latest
        # bash here means -o pipefail, so a failed ls-remote fails the run instead of skipping the deploy.
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$SHA" ]; then echo latest=true >> "$GITHUB_OUTPUT"; else echo "main moved on to $head; skipping"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.latest.outputs.latest == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.latest.outputs.latest == 'true'
        run: npm ci
      - if: steps.latest.outputs.latest == 'true'
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.latest == 'true'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: [build]
    if: needs.build.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
